<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" version="1.1">
  <rect width="1600" height="800" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="800" y="62" font-size="34" font-weight="600" text-anchor="middle" fill="#1a1a1a">Four checks between a generated statement and the data</text>
    <text x="800" y="102" font-size="21" text-anchor="middle" fill="#6b7280">Each layer assumes every layer before it has already failed</text>

    <!-- source -->
    <rect x="60" y="300" width="210" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="165" y="358" font-size="22" font-weight="600" text-anchor="middle" fill="#374151">LLM</text>
    <text x="165" y="390" font-size="18" text-anchor="middle" fill="#6b7280">proposes</text>
    <text x="165" y="414" font-size="18" text-anchor="middle" fill="#6b7280">a statement</text>
    <text x="165" y="482" font-size="16" font-style="italic" text-anchor="middle" fill="#9ca3af">untrusted</text>

    <!-- layers 1-3 -->
    <g>
      <rect x="320" y="285" width="230" height="180" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="435" y="322" font-size="16" font-weight="600" text-anchor="middle" fill="#3b82f6">LAYER 1</text>
      <text x="435" y="360" font-size="23" font-weight="600" text-anchor="middle" fill="#1e3a8a">Parse</text>
      <text x="435" y="396" font-size="17" text-anchor="middle" fill="#475569">statement type</text>
      <text x="435" y="420" font-size="17" text-anchor="middle" fill="#475569">must be SELECT</text>
      <text x="435" y="450" font-size="15" font-style="italic" text-anchor="middle" fill="#94a3b8">sqlparse</text>
    </g>
    <g>
      <rect x="590" y="285" width="230" height="180" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="705" y="322" font-size="16" font-weight="600" text-anchor="middle" fill="#3b82f6">LAYER 2</text>
      <text x="705" y="360" font-size="23" font-weight="600" text-anchor="middle" fill="#1e3a8a">Blocklist</text>
      <text x="705" y="396" font-size="17" text-anchor="middle" fill="#475569">INSERT · UPDATE</text>
      <text x="705" y="420" font-size="17" text-anchor="middle" fill="#475569">DROP · GRANT · …</text>
      <text x="705" y="450" font-size="15" font-style="italic" text-anchor="middle" fill="#94a3b8">second opinion</text>
    </g>
    <g>
      <rect x="860" y="285" width="230" height="180" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <text x="975" y="322" font-size="16" font-weight="600" text-anchor="middle" fill="#3b82f6">LAYER 3</text>
      <text x="975" y="360" font-size="23" font-weight="600" text-anchor="middle" fill="#1e3a8a">Single</text>
      <text x="975" y="396" font-size="17" text-anchor="middle" fill="#475569">no interior</text>
      <text x="975" y="420" font-size="17" text-anchor="middle" fill="#475569">semicolons</text>
      <text x="975" y="450" font-size="15" font-style="italic" text-anchor="middle" fill="#94a3b8">no chaining</text>
    </g>

    <!-- layer 4 emphasised -->
    <rect x="1130" y="268" width="250" height="214" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="4"/>
    <text x="1255" y="306" font-size="16" font-weight="600" text-anchor="middle" fill="#059669">LAYER 4</text>
    <text x="1255" y="346" font-size="25" font-weight="700" text-anchor="middle" fill="#064e3b">Privilege</text>
    <text x="1255" y="384" font-size="17" text-anchor="middle" fill="#334155">read-only database</text>
    <text x="1255" y="408" font-size="17" text-anchor="middle" fill="#334155">credential</text>
    <text x="1255" y="446" font-size="16" font-weight="600" text-anchor="middle" fill="#059669">cannot write, ever</text>

    <!-- database -->
    <ellipse cx="1500" cy="316" rx="62" ry="20" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <path d="M1438 316 L1438 434 A62 20 0 0 0 1562 434 L1562 316" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="1500" y="392" font-size="19" font-weight="600" text-anchor="middle" fill="#334155">data</text>

    <!-- arrows -->
    <g stroke="#9ca3af" stroke-width="3" fill="none" marker-end="url(#a)">
      <path d="M272 375 L316 375"/><path d="M552 375 L586 375"/>
      <path d="M822 375 L856 375"/><path d="M1092 375 L1126 375"/>
      <path d="M1382 375 L1432 375"/>
    </g>
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
      </marker>
    </defs>

    <!-- footnote -->
    <text x="800" y="596" font-size="21" text-anchor="middle" fill="#374151">Layers 1–3 are application code written by someone who can be wrong.</text>
    <text x="800" y="632" font-size="21" font-weight="600" text-anchor="middle" fill="#064e3b">Layer 4 does not care how convincing the SQL looks.</text>
    <text x="800" y="700" font-size="19" text-anchor="middle" fill="#9ca3af">A read-only guarantee that lives in a prompt is a preference, not a guarantee.</text>
  </g>
</svg>
