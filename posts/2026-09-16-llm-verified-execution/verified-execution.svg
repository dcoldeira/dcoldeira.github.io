<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" version="1.1">
  <rect width="1600" height="800" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="800" y="62" font-size="34" font-weight="600" text-anchor="middle" fill="#1a1a1a">The model translates twice and computes nothing</text>
    <text x="800" y="102" font-size="21" text-anchor="middle" fill="#6b7280">Generation proposes a call; a deterministic engine produces the quantity</text>

    <!-- question -->
    <rect x="50" y="300" width="200" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="150" y="358" font-size="22" font-weight="600" text-anchor="middle" fill="#374151">Question</text>
    <text x="150" y="392" font-size="17" text-anchor="middle" fill="#6b7280">natural</text>
    <text x="150" y="416" font-size="17" text-anchor="middle" fill="#6b7280">language</text>

    <!-- code-gen LLM -->
    <rect x="300" y="285" width="240" height="180" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
    <text x="420" y="322" font-size="16" font-weight="600" text-anchor="middle" fill="#b45309">GENERATIVE</text>
    <text x="420" y="360" font-size="23" font-weight="600" text-anchor="middle" fill="#78350f">Code-gen LLM</text>
    <text x="420" y="396" font-size="17" text-anchor="middle" fill="#475569">writes a call against</text>
    <text x="420" y="420" font-size="17" text-anchor="middle" fill="#475569">the physics engine</text>
    <text x="420" y="450" font-size="15" font-style="italic" text-anchor="middle" fill="#a16207">untrusted</text>

    <!-- sandbox / executor -->
    <rect x="590" y="255" width="420" height="290" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="800" y="292" font-size="16" font-weight="600" text-anchor="middle" fill="#3b82f6">DETERMINISTIC</text>
    <text x="800" y="330" font-size="23" font-weight="600" text-anchor="middle" fill="#1e3a8a">Sandboxed executor</text>
    <line x1="620" y1="350" x2="980" y2="350" stroke="#bfdbfe" stroke-width="2"/>
    <text x="800" y="384" font-size="17" text-anchor="middle" fill="#334155">imports stripped, __import__ blocked</text>
    <text x="800" y="414" font-size="17" text-anchor="middle" fill="#334155">pre-built namespace of tested functions</text>
    <text x="800" y="444" font-size="17" text-anchor="middle" fill="#334155">answer must be assigned to `result`</text>
    <rect x="620" y="468" width="360" height="52" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="800" y="500" font-size="17" text-anchor="middle" fill="#1e3a8a">numeric result, or a traceback</text>

    <!-- explain LLM -->
    <rect x="1060" y="285" width="240" height="180" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
    <text x="1180" y="322" font-size="16" font-weight="600" text-anchor="middle" fill="#b45309">GENERATIVE</text>
    <text x="1180" y="360" font-size="23" font-weight="600" text-anchor="middle" fill="#78350f">Explain LLM</text>
    <text x="1180" y="396" font-size="17" text-anchor="middle" fill="#475569">phrases the computed</text>
    <text x="1180" y="420" font-size="17" text-anchor="middle" fill="#475569">number in English</text>
    <text x="1180" y="450" font-size="15" font-style="italic" text-anchor="middle" fill="#a16207">cannot change it</text>

    <!-- answer -->
    <rect x="1350" y="300" width="200" height="150" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="1450" y="358" font-size="22" font-weight="600" text-anchor="middle" fill="#064e3b">Answer</text>
    <text x="1450" y="392" font-size="17" text-anchor="middle" fill="#059669">checkable against</text>
    <text x="1450" y="416" font-size="17" text-anchor="middle" fill="#059669">closed-form theory</text>

    <!-- arrows -->
    <defs>
      <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <path d="M0,0 L10,4 L0,8 z" fill="#9ca3af"/>
      </marker>
    </defs>
    <line x1="252" y1="375" x2="294" y2="375" stroke="#9ca3af" stroke-width="3" marker-end="url(#a)"/>
    <line x1="542" y1="375" x2="584" y2="375" stroke="#9ca3af" stroke-width="3" marker-end="url(#a)"/>
    <line x1="1012" y1="375" x2="1054" y2="375" stroke="#9ca3af" stroke-width="3" marker-end="url(#a)"/>
    <line x1="1302" y1="375" x2="1344" y2="375" stroke="#9ca3af" stroke-width="3" marker-end="url(#a)"/>

    <!-- retry loop -->
    <path d="M 700 545 L 700 610 L 420 610 L 420 471" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#a)"/>
    <text x="560" y="638" font-size="17" text-anchor="middle" fill="#b45309">traceback returned to the model, up to twice</text>

    <text x="800" y="712" font-size="19" text-anchor="middle" fill="#6b7280">The prompt is not load-bearing: the boundary is enforced by the namespace, not by instruction</text>
  </g>
</svg>
